<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koneat - Perfil</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="light-theme">

    <div class="app-container">
        <!-- Topo Header -->
        <header class="profile-header">
            <div class="header-logo">
                <span class="logo-bold">K.</span> KONEAT
            </div>
            <div class="header-actions">
                <button class="icon-btn" aria-label="Direct">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
                <div class="dropdown-wrapper">
                    <button class="icon-btn" id="menuBtn" aria-label="Opções">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
                    </button>
                    <!-- Menu Suspenso -->
                    <div class="dropdown-menu" id="dropdownMenu">
                        <a href="configuracoes.html" class="dropdown-item">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                            Configurações
                        </a>
                        <a href="privacidade.html" class="dropdown-item">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                            Privacidade
                        </a>
                        <a href="termos.html" class="dropdown-item">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
                            Termos
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Informações do Perfil -->
        <section class="profile-info">
            <div class="avatar-container">
                <div class="avatar-circle">
                    <svg width="55" height="55" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </div>
                <button class="camera-btn" aria-label="Alterar Foto">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                </button>
            </div>

            <div class="user-details">
                <h1 class="user-name">David Silva</h1>
                <p class="user-tag">@david.silva</p>
                <p class="user-bio">Construindo meu futuro</p>
            </div>
        </section>

        <!-- Métricas -->
        <section class="stats-bar">
            <div class="stat-item">
                <span class="stat-number">0</span>
                <span class="stat-label">Publicações</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <span class="stat-number">0</span>
                <span class="stat-label">Seguidores</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <span class="stat-number">0</span>
                <span class="stat-label">Seguindo</span>
            </div>
        </section>

        <!-- Botões de Ação do Perfil -->
        <section class="action-buttons">
            <a href="editar-perfil.html" class="btn-secondary">Editar perfil</a>
            <button class="btn-secondary">Compartilhar perfil</button>
        </section>

        <!-- Tabs de Conteúdo -->
        <nav class="content-tabs">
            <button class="tab-btn active">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                <span>Todos</span>
            </button>
            <button class="tab-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="M7 22l-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg>
                <span>Reposts</span>
            </button>
            <button class="tab-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>Marcações</span>
            </button>
        </nav>

        <!-- Área Vazia / Feed Painel -->
        <section class="feed-empty-state">
            <button class="btn-create-post">Crie sua primeira publicação</button>
        </section>

        <!-- Barra de Navegação Inferior (Bottom Nav Flutuante) -->
        <nav class="bottom-nav">
            <a href="busca.html" class="nav-item" aria-label="Buscar">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </a>
            
            <a href="criar.html" class="nav-item btn-tiktok-add" aria-label="Criar">
                <div class="tiktok-box">
                    <span class="plus-sign">+</span>
                </div>
            </a>

            <a href="reels.html" class="nav-item" aria-label="Vídeos">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="2"><rect x="2" y="3" width="20" height="18" rx="4"></rect><polygon points="10 8 16 12 10 16 10 8"></polygon></svg>
            </a>

            <a href="passo1.html" class="nav-item active" aria-label="Perfil">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </a>
        </nav>
    </div>

    <script src="js/app.js"></script>
</body>
              </html>
