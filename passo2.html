<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koneat - Vídeos Virais</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Estilos Globais do Tema Escuro Fumê */
        body.dark-video-theme {
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Container do Feed com Scroll Snap Estilo Reels/TikTok */
        .reels-feed-container {
            width: 100vw;
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }

        .reels-feed-container::-webkit-scrollbar {
            display: none;
        }

        /* Header Superior Dinâmico com Divisão Transparente Sutil */
        .video-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 50;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08); /* Linha sutil de divisão */
            transition: transform 0.25s ease-in-out, opacity 0.25s ease-in-out;
        }

        .video-header.hidden {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .video-header-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            letter-spacing: -0.3px;
        }

        .header-actions-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-btn-top {
            background: none;
            border: none;
            cursor: pointer;
            color: #ffffff;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Estado Vazio Totalmente Limpo */
        .empty-feed-wrapper {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8e8e93;
            font-size: 15px;
            font-weight: 500;
            text-align: center;
            pointer-events: none;
            user-select: none;
        }

        /* Card de Vídeo Tela Cheia */
        .reel-card {
            width: 100vw;
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .reel-video-element {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Informações do Criador Real (Canto Inferior Esquerdo) - Acompanha o Scroll */
        .video-footer-info {
            position: absolute;
            bottom: 80px;
            left: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
        }

        .creator-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .creator-avatar-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #111111;
        }

        .creator-avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .creator-name {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
        }

        .btn-follow {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.6);
            color: #ffffff;
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        /* Ações Laterais Reações (Canto Inferior Direito) - Acompanha o Scroll */
        .video-actions-sidebar {
            position: absolute;
            right: 16px;
            bottom: 85px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            z-index: 10;
        }

        .action-item {
            background: none;
            border: none;
            cursor: pointer;
            color: #ffffff;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            transition: transform 0.15s ease;
        }

        .action-item:active {
            transform: scale(0.88);
        }

        .action-item svg {
            width: 26px;
            height: 26px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .action-item.liked svg {
            fill: #e74c3c;
            stroke: #e74c3c;
        }

        .action-item.saved svg {
            fill: #ffffff;
            stroke: #ffffff;
        }

        .action-item.reposted svg {
            stroke: #00ff88;
        }

        /* Menu Flutuante Decisões (3 Barrinhas) */
        .dropdown-menu-decisions {
            position: fixed;
            top: 50px;
            right: 16px;
            background: #ffffff;
            width: 200px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            padding: 8px 0;
            z-index: 100;
            color: #000000;
        }

        .dropdown-menu-decisions.show {
            display: flex;
        }

        .decision-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 700;
            border-bottom: 1px solid #f0f0f0;
        }

        .decision-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 600;
            color: #333333;
            text-decoration: none;
            cursor: pointer;
        }

        .decision-footer {
            padding: 8px 16px;
            font-size: 11px;
            color: #8e8e93;
            border-top: 1px solid #f0f0f0;
        }

        /* Barra de Navegação Inferior Fixa de Ponta a Ponta */
        .bottom-nav-fixed {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 62px;
            background: #121214;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 999;
            box-sizing: border-box;
            padding: 0 10px;
        }

        .nav-link {
            background: none;
            border: none;
            cursor: pointer;
            color: #8e8e93;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            width: 48px;
            height: 48px;
        }

        /* Ícone de Vídeo Ativo na Barra Inferior */
        .nav-link.active-video .video-box-filled {
            fill: #ffffff;
        }
        .nav-link.active-video .video-play-inner {
            fill: #121214;
        }
    </style>
</head>
<body class="dark-video-theme">

    <!-- Header Fixo Superior (Com Título, Busca, Menu e Divisão Sutil) -->
    <header class="video-header" id="mainHeader">
        <h1 class="video-header-title">Virais start</h1>
        <div class="header-actions-right">
            <button type="button" class="icon-btn-top" aria-label="Buscar">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
            <button type="button" class="icon-btn-top" id="menuDecisionsBtn" aria-label="Menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
        </div>
    </header>

    <!-- Menu Flutuante Decisões (3 Barrinhas) -->
    <div class="dropdown-menu-decisions" id="dropdownDecisions">
        <div class="decision-header">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
            Decisões
        </div>
        <div class="decision-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>
            Não tenho interesse
        </div>
        <div class="decision-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" y1="22" x2="4" y2="15"></line></svg>
            Denunciar
        </div>
        <div class="decision-item" style="color: #e74c3c;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
            Bloquear
        </div>
        <div class="decision-footer">
            Koneat start · 1.1.4
        </div>
    </div>

    <!-- Feed de Vídeos Vertical com Arraste -->
    <main class="reels-feed-container" id="reelsContainer">
        <!-- Renderizado dinamicamente via JS -->
    </main>

    <!-- Barra de Navegação Inferior Fixa -->
    <nav class="bottom-nav-fixed">
        <!-- 1. Home (Casinha) -->
        <a href="./home.html" class="nav-link" aria-label="Home">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </a>

        <!-- 2. Criar (+) -->
        <a href="./criar.html" class="nav-link" aria-label="Criar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </a>

        <!-- 3. Vídeos Virais (Ativo) -->
        <a href="./passo2.html" class="nav-link active-video" aria-label="Vídeos">
            <svg width="24" height="24" viewBox="0 0 24 24">
                <rect class="video-box-filled" x="2" y="2" width="20" height="20" rx="5" fill="#ffffff"></rect>
                <polygon class="video-play-inner" points="10,8 16,12 10,16" fill="#121214"></polygon>
            </svg>
        </a>

        <!-- 4. Perfil -->
        <a href="./passo1.html" class="nav-link" aria-label="Perfil">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </a>
    </nav>

    <!-- Scripts de Interação -->
    <script>
        const reelsContainer = document.getElementById('reelsContainer');
        const mainHeader = document.getElementById('mainHeader');

        // Esconder/Mostrar Header no Scroll
        reelsContainer.addEventListener('scroll', () => {
            if (reelsContainer.scrollTop > 50) {
                mainHeader.classList.add('hidden');
            } else {
                mainHeader.classList.remove('hidden');
            }
        });

        // Carregar vídeos reais salvos
        function renderViraisFeed() {
            const viraisFeed = JSON.parse(localStorage.getItem('koneat_virais_feed') || '[]');

            if (viraisFeed.length === 0) {
                // Estado Inicial: Sem posts, sem fakes, apenas mensagem no meio
                reelsContainer.innerHTML = `<div class="empty-feed-wrapper">Os vídeos virais aparecerão aqui.</div>`;
            } else {
                // Renderiza os vídeos reais postados
                reelsContainer.innerHTML = viraisFeed.map((item) => {
                    const isLiked = localStorage.getItem(`koneat_like_${item.id}`) === 'true';
                    const isReposted = localStorage.getItem(`koneat_repost_${item.id}`) === 'true';
                    const isSaved = localStorage.getItem(`koneat_save_${item.id}`) === 'true';
                    const authorName = item.author || 'Eributtler';

                    return `
                        <article class="reel-card" data-video-id="${item.id}">
                            <video class="reel-video-element" src="${item.url}" autoplay loop muted playsinline></video>

                            <!-- Informações do Perfil do Criador Real -->
                            <div class="video-footer-info">
                                <div class="creator-row">
                                    <div class="creator-avatar-circle">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                                    </div>
                                    <span class="creator-name">${authorName}</span>
                                    <button type="button" class="btn-follow">Seguir</button>
                                </div>
                            </div>

                            <!-- Reações Laterais Direitas (Com Seta Curvada ↪️ Correta de Compartilhar) -->
                            <div class="video-actions-sidebar">
                                <!-- 1. Curtir -->
                                <button type="button" class="action-item btn-like ${isLiked ? 'liked' : ''}" aria-label="Curtir">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                                </button>

                                <!-- 2. Comentar -->
                                <button type="button" class="action-item btn-comment" aria-label="Comentar">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                                </button>

                                <!-- 3. Repost (Setas Circulares) -->
                                <button type="button" class="action-item btn-repost ${isReposted ? 'reposted' : ''}" aria-label="Repostar">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="M7 22l-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg>
                                </button>

                                <!-- 4. Marcar (Bandeira) -->
                                <button type="button" class="action-item btn-save ${isSaved ? 'saved' : ''}" aria-label="Marcar">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                                </button>

                                <!-- 5. Compartilhar (Seta Curvada para Direita) -->
                                <button type="button" class="action-item btn-share" aria-label="Compartilhar">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M4 12v-1a7 7 0 0 1 7-7h9"></path>
                                        <polyline points="16 8 20 4 16 0"></polyline>
                                    </svg>
                                </button>
                            </div>
                        </article>
                    `;
                }).join('');

                // Ativar escutadores das reações
                document.querySelectorAll('.reel-card').forEach(card => {
                    const videoId = card.getAttribute('data-video-id');
                    const btnLike = card.querySelector('.btn-like');
                    const btnRepost = card.querySelector('.btn-repost');
                    const btnSave = card.querySelector('.btn-save');

                    btnLike?.addEventListener('click', () => {
                        const isLiked = btnLike.classList.toggle('liked');
                        localStorage.setItem(`koneat_like_${videoId}`, isLiked);
                    });

                    btnRepost?.addEventListener('click', () => {
                        const isReposted = btnRepost.classList.toggle('reposted');
                        localStorage.setItem(`koneat_repost_${videoId}`, isReposted);
                    });

                    btnSave?.addEventListener('click', () => {
                        const isSaved = btnSave.classList.toggle('saved');
                        localStorage.setItem(`koneat_save_${videoId}`, isSaved);
                    });
                });
            }
        }

        // Menu Decisões (3 barrinhas)
        const menuBtn = document.getElementById('menuDecisionsBtn');
        const dropdown = document.getElementById('dropdownDecisions');

        if (menuBtn && dropdown) {
            menuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                dropdown.classList.toggle('show');
            });

            document.addEventListener('click', () => {
                dropdown.classList.remove('show');
            });
        }

        // Inicializar renderização
        renderViraisFeed();
    </script>
</body>
</html>
